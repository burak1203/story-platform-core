server:
  port: 8080

spring:
  application:
    name: core-api

  # 1. PostgreSQL + pgvector Bağlantısı
  datasource:
    url: jdbc:postgresql://localhost:5432/kurgu_db
    username: kurgu_admin
    password: admin_password_123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true # Geliştirme aşamasında SQL sorgularını terminalde görmek için
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 2. Redis (JWT kara listesi için)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 3. Asenkron Mesajlaşma (Kafka) Bağlantısı
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: story-platform-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.Map
        spring.json.use.type.headers: false
# Uygulama seviyesinde tek noktadan yönetilen ayarlar
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-worker:
    embed-url: ${AI_WORKER_EMBED_URL:http://localhost:8000/api/embed}
  story:
    pending-timeout-minutes: 5
    pending-check-interval-ms: 60000
